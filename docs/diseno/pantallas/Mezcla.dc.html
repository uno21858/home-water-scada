<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const modo = st.modo || 'auto';
    const M = {
      apagada: { estado: 'Apagada', lado: false, ladoTxt: '', num: '', barra: false, pct: 0, sub: 'A mano · el programa no la prende', gira: false },
      prendida: { estado: 'Prendida', lado: true, ladoTxt: 'Se apaga en', num: '60', barra: true, pct: 0, sub: 'A mano · se apaga sola a las 19:42', gira: true },
      auto: { estado: 'Prendida', lado: true, ladoTxt: 'Faltan', num: '3', barra: true, pct: 80, sub: 'Auto · programa de las 18:30', gira: true }
    };
    const c = M[modo] || M.auto;
    const seg = {};
    ['apagada', 'prendida', 'auto'].forEach((k) => {
      const on = k === modo;
      seg[k] = {
        bg: on ? '#e3e8ed' : 'transparent',
        color: on ? '#14181c' : '#a9b3be',
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ modo: k })
      };
    });
    return {
      seg: seg,
      estado: c.estado,
      lado: c.lado,
      ladoTxt: c.ladoTxt,
      num: c.num,
      barra: c.barra,
      pct: String(c.pct),
      sub: c.sub,
      rotor: c.gira ? 'rotor gira' : 'rotor',
      imp: c.gira ? '#3cc8ea' : '#6d7987'
    };
  }
}
</script>
