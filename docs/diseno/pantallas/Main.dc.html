<script type="text/x-dc" data-dc-script data-props='{"flujo":{"editor":"boolean","default":true},"caida":{"editor":"enum","options":["normal","revisar","tapados"],"default":"normal"},"fase":{"editor":"enum","options":["1","1.5","2"],"default":"2"},"bombaR":{"editor":"boolean","default":true},"$preview":{"width":1024,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const flujo = this.props.flujo ?? true;
    const caida = this.props.caida ?? 'normal';
    const fase = this.props.fase ?? '2';
    const presion = fase !== '1';
    const orp = fase === '2';
    const bombaR = this.props.bombaR ?? true;
    const rInst = orp;
    const rGira = rInst && bombaR;
    const C = {
      normal: { p2: 38, dp: 4, palabra: 'Normal', color: '#55c993', fondo: '#16301f', estado: 'ok' },
      revisar: { p2: 35, dp: 7, palabra: 'Revisar', color: '#f2a83a', fondo: '#3a2a12', estado: 'advertencia' },
      tapados: { p2: 30, dp: 12, palabra: 'Tapados', color: '#ff7069', fondo: '#46181b', estado: 'alarma' }
    };
    const c = C[caida] || C.normal;
    return {
      modo: flujo ? 'pid fluye' : 'pid',
      estado: presion ? c.estado : 'ok',
      presion: presion,
      sinPresion: !presion,
      orp: orp,
      sinOrp: !orp,
      p2: String(c.p2),
      p2Pct: (c.p2 / 80 * 100).toFixed(1),
      dp: String(c.dp),
      dpPalabra: c.palabra,
      dpColor: c.color,
      dpFondo: c.fondo,
      fValor: flujo ? '12.4' : '0.0',
      fColor: flujo ? '#e9edf1' : '#7c8793',
      fPct: flujo ? '41.3' : '0',
      rInst: rInst,
      rNo: !rInst,
      rEstado: bombaR ? 'Prendida' : 'Apagada',
      rClase: rGira ? 'rotor gira' : 'rotor',
      rColor: rInst ? (bombaR ? '#3cc8ea' : '#6d7987') : '#3a434d',
      rBorde: rInst ? '#a9b3be' : '#3a434d',
      rRaya: rInst ? 'none' : '4 3'
    };
  }
}
</script>
