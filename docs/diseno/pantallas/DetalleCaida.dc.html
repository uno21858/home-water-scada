<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const X = (q) => 72 + q / 15 * 512;
    const Y = (p) => 112 - p / 6 * 102;
    const nuevo = (q) => 0.12 * q + 0.0072 * q * q;
    const base = [];
    for (let q = 0; q <= 15; q += 0.5) base.push(X(q).toFixed(1) + ',' + Y(nuevo(q)).toFixed(1));
    const punto = (q, p) => {
      const x = X(q), y = Y(p);
      return 'M' + (x - 4).toFixed(1) + ' ' + y.toFixed(1) + 'a4 4 0 1 0 8 0a4 4 0 1 0 -8 0Z';
    };
    let viejos = '', recientes = '';
    for (let i = 0; i < 42; i++) {
      const dia = i * 30 / 42;
      const q = 3 + ((Math.sin(i * 12.9898) * 43758.5453) % 1 + 1) % 1 * 10;
      const ruido = (((Math.sin(i * 78.233) * 12345.678) % 1 + 1) % 1 - 0.5) * 0.4;
      const factor = 1.05 + 0.45 * dia / 30;
      const p = nuevo(q) * factor + ruido;
      if (dia >= 27) recientes += punto(q, p);
      else viejos += punto(q, p);
    }
    return {
      base: base.join(' '),
      viejos: viejos,
      recientes: recientes,
      hoyX: X(12.4).toFixed(1),
      hoyY: Y(4).toFixed(1)
    };
  }
}
</script>
