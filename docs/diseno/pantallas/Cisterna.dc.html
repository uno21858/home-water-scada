<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const s = [];
    for (let i = 0; i < 168; i++) {
      const hora = (19 + i) % 24;
      const t = (hora - 6.5 + 24) % 24;
      let v = 560 + 165 * Math.exp(-t / 20) + 8 * Math.sin(i / 2.3);
      if (i > 60 && i < 84) v -= 70 * Math.exp(-Math.abs(i - 72) / 8);
      s.push(Math.round(v));
    }
    s[167] = 650;
    const Y = (v) => 16 + 82 - (v - 400) / 400 * 82;
    const puntos = s.map((v, i) => (72 + i / 167 * 512).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ');
    return { puntos: puntos, yFinal: Y(650).toFixed(1) };
  }
}
</script>
