<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const ancho = 568, alto = 6, bajo = 42;
    const medio = ancho / 8.18 / 2;
    const pts = ['0,' + alto];
    let x = 0, arriba = true;
    while (x < ancho) {
      const nx = Math.min(ancho, x + medio);
      pts.push(nx.toFixed(1) + ',' + (arriba ? alto : bajo));
      if (nx < ancho) {
        arriba = !arriba;
        pts.push(nx.toFixed(1) + ',' + (arriba ? alto : bajo));
      }
      x = nx;
    }
    return { onda: pts.join(' ') };
  }
}
</script>
