<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const rango = st.rango || 'semana';
    const senal = st.senal || 'litros';
    const L = 88, W = 420, B = 228, H = 214;
    const nBand = rango === 'dia' ? 24 : (rango === 'semana' ? 7 : 30);
    const cx = (i) => L + (i + 0.5) * W / nBand;
    const hx = (h) => L + h / 24 * W;
    const yv = (v, min, max) => B - (v - min) / (max - min) * H;
    const miles = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    const f1 = (n) => n.toFixed(1);

    const diaL = [10, 5, 3, 3, 5, 25, 99, 156, 140, 99, 78, 70, 86, 95, 78, 70, 82, 245, 511];
    const diaD = diaL.map((v, h) => (h === 6 ? 40 : 0));
    const semL = [1920, 2140, 1780, 1900, 1800, 1990, 1860];
    const semD = [41, 38, 43, 36, 45, 36, 40];
    const mesL = [], mesD = [];
    for (let i = 0; i < 30; i++) {
      mesL.push(Math.round(1900 + 220 * Math.sin(i * 0.9) + 90 * Math.sin(i * 2.3)));
      mesD.push(Math.round(40 + 4 * Math.sin(i * 1.3)));
    }
    for (let i = 0; i < 7; i++) { mesL[23 + i] = semL[i]; mesD[23 + i] = semD[i]; }

    const diaP1 = [48, 49, 50, 50, 49, 46, 30, 24, 22, 23, 24, 25, 23, 24, 26, 27, 30, 36, 42];
    const diaP2 = diaP1.map((p, h) => Math.round(p - 4 * Math.min(1, diaL[h] / (h === 18 ? 42 : 60) / 12.4)));
    const semP1 = [43, 42, 43, 41, 42, 42, 42];
    const semP2 = [39, 38, 38, 35, 38, 38, 38];
    const mesP1 = [], mesP2 = [];
    for (let i = 0; i < 30; i++) {
      const p1 = Math.round(41 + 2 * Math.sin(i * 0.7));
      const dp = i < 27 ? 3 + Math.round(i * 0.08) : 4;
      mesP1.push(p1);
      mesP2.push(p1 - dp);
    }
    for (let i = 0; i < 7; i++) { mesP1[23 + i] = semP1[i]; mesP2[23 + i] = semP2[i]; }

    const semO = [];
    for (let k = 0; k < 168; k++) {
      const hora = (19 + k) % 24;
      const t = (hora - 6.5 + 24) % 24;
      let v = 560 + 165 * Math.exp(-t / 20) + 8 * Math.sin(k / 2.3);
      if (k > 60 && k < 84) v -= 70 * Math.exp(-Math.abs(k - 72) / 8);
      semO.push(Math.round(v));
    }
    semO[167] = 650;
    const diaO = [];
    for (let h = 0; h < 19; h++) diaO.push(semO[149 + h]);
    const mesO = [];
    for (let i = 0; i < 30; i++) mesO.push(Math.round(655 + 12 * Math.sin(i * 0.8) - (i === 25 ? 45 : 0)));

    let xlab;
    if (rango === 'dia') {
      xlab = [[hx(0), '0:00', 's'], [hx(6), '6:00', 'm'], [hx(12), '12:00', 'm'], [hx(18), '18:00', 'm'], [hx(24), '24:00', 'e']];
    } else if (rango === 'semana') {
      xlab = ['Do', 'Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Hoy'].map((t, i) => [cx(i), t, 'm']);
    } else {
      xlab = [[cx(0), '4 sep', 's'], [cx(10), '14 sep', 'm'], [cx(20), '24 sep', 'm'], [cx(29), 'Hoy', 'e']];
    }
    xlab = xlab.map((a) => ({
      t: a[1],
      left: f1(a[2] === 's' ? a[0] - 8 : (a[2] === 'e' ? a[0] - 72 : a[0] - 40)),
      align: a[2] === 's' ? 'left' : (a[2] === 'e' ? 'right' : 'center')
    }));

    let titulo = '', leyenda = [], ticks = [], min = 0, max = 1, ticks2 = [];
    let barrasA = '', barrasB = '', linea1 = '', linea2 = '', banda = '', color1 = '#3cc8ea';
    let refY = -20, refVer = 'none';
    const xLinea = (i) => (rango === 'dia' ? hx(i) : cx(i));

    if (senal === 'litros') {
      const datL = rango === 'dia' ? diaL : (rango === 'semana' ? semL : mesL);
      const datD = rango === 'dia' ? diaD : (rango === 'semana' ? semD : mesD);
      max = rango === 'dia' ? 600 : 3000;
      ticks = rango === 'dia' ? [0, 200, 400, 600] : [0, 1000, 2000, 3000];
      ticks2 = [0, 30, 60];
      titulo = rango === 'dia' ? 'Litros y dosis por hora' : (rango === 'semana' ? 'Litros y dosis por día' : 'Litros y dosis, 30 días');
      leyenda = [{ w: 18, h: 18, color: '#3cc8ea', texto: 'Litros' }, { w: 18, h: 18, color: '#a9b3be', texto: 'Dosis mL (eje derecho)' }];
      const bw = rango === 'dia' ? 6 : (rango === 'semana' ? 20 : 5);
      const off = rango === 'dia' ? 3.5 : (rango === 'semana' ? 11 : 3);
      datL.forEach((v, i) => {
        const x = cx(i) - off - bw / 2, y = yv(v, 0, max);
        barrasA += 'M' + f1(x) + ' ' + f1(y) + 'h' + bw + 'V' + B + 'h-' + bw + 'Z';
      });
      datD.forEach((v, i) => {
        if (v <= 0) return;
        const x = cx(i) + off - bw / 2, y = yv(v, 0, 60);
        barrasB += 'M' + f1(x) + ' ' + f1(y) + 'h' + bw + 'V' + B + 'h-' + bw + 'Z';
      });
    } else if (senal === 'presiones') {
      const p1 = rango === 'dia' ? diaP1 : (rango === 'semana' ? semP1 : mesP1);
      const p2 = rango === 'dia' ? diaP2 : (rango === 'semana' ? semP2 : mesP2);
      max = 60;
      ticks = [0, 20, 40, 60];
      titulo = 'P1 y P2 · psi';
      leyenda = [{ w: 24, h: 4, color: '#e9edf1', texto: 'P1' }, { w: 24, h: 4, color: '#a9b3be', texto: 'P2' }, { w: 18, h: 18, color: '#39424d', texto: 'Caída del tren' }];
      color1 = '#e9edf1';
      const a = p1.map((v, i) => f1(xLinea(i)) + ',' + f1(yv(v, 0, 60)));
      const b = p2.map((v, i) => f1(xLinea(i)) + ',' + f1(yv(v, 0, 60)));
      linea1 = a.join(' ');
      linea2 = b.join(' ');
      banda = a.concat(b.slice().reverse()).join(' ');
    } else {
      const o = rango === 'dia' ? diaO : (rango === 'semana' ? semO : mesO);
      min = 400;
      max = 800;
      ticks = [400, 600, 800];
      titulo = 'ORP de la cisterna · mV';
      leyenda = [{ w: 24, h: 4, color: '#3cc8ea', texto: 'ORP' }, { w: 24, h: 4, color: '#55c993', texto: 'Oxidante desde 650' }];
      const xo = (i) => (rango === 'semana' ? L + i / 167 * W : xLinea(i));
      linea1 = o.map((v, i) => f1(xo(i)) + ',' + f1(yv(v, 400, 800))).join(' ');
      refY = f1(yv(650, 400, 800));
      refVer = 'inline';
    }

    let rejilla = '';
    ticks.forEach((v) => { if (v !== min) rejilla += 'M' + L + ' ' + f1(yv(v, min, max)) + 'H' + (L + W); });
    const ylab = ticks.map((v) => ({ t: miles(v), top: f1(84 + yv(v, min, max) - 16) }));
    const y2lab = ticks2.map((v) => ({ t: String(v), top: f1(84 + yv(v, 0, 60) - 16) }));

    const opc = (lista, actual, campo) => {
      const o = {};
      lista.forEach((k) => {
        const on = k === actual;
        o[k] = {
          bg: on ? '#e3e8ed' : 'transparent',
          color: on ? '#14181c' : '#a9b3be',
          pressed: on ? 'true' : 'false',
          pick: () => this.setState({ [campo]: k })
        };
      });
      return o;
    };

    return {
      r: opc(['dia', 'semana', 'mes'], rango, 'rango'),
      s: opc(['litros', 'presiones', 'orp'], senal, 'senal'),
      titulo: titulo,
      leyenda: leyenda,
      rejilla: rejilla,
      banda: banda,
      barrasA: barrasA,
      barrasB: barrasB,
      linea1: linea1,
      linea2: linea2,
      color1: color1,
      refY: refY,
      refVer: refVer,
      ylab: ylab,
      y2lab: y2lab,
      xlab: xlab
    };
  }
}
</script>
