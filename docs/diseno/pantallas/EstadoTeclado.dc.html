<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const actual = () => {
      const v = (this.state || {}).valor;
      return v == null ? '45' : v;
    };
    const valor = actual();
    const pon = (d) => () => {
      const v = actual();
      if (v.length >= 3) return;
      this.setState({ valor: v === '0' ? d : v + d });
    };
    const t = {
      limpiar: () => this.setState({ valor: '' }),
      borrar: () => this.setState({ valor: actual().slice(0, -1) })
    };
    for (let i = 0; i <= 9; i++) t['k' + i] = pon(String(i));
    return {
      valor: valor,
      cursor: (22 + valor.length * 50.4 + 6).toFixed(1),
      t: t
    };
  }
}
</script>
