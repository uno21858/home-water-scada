class Component extends DCLogic {
  renderVals() {
    const activa = this.props.activa ?? 'tren';
    const ids = ['tren', 'resumen', 'flujo', 'cisterna', 'dosis', 'historial', 'ajustes'];
    const c = {}, bg = {}, barra = {}, cur = {};
    ids.forEach((id) => {
      const on = id === activa;
      c[id] = on ? '#e9edf1' : '#a9b3be';
      bg[id] = on ? '#2d343d' : 'transparent';
      barra[id] = on ? '#e9edf1' : 'transparent';
      cur[id] = on ? 'page' : 'false';
    });
    return { c: c, bg: bg, barra: barra, cur: cur };
  }
}
