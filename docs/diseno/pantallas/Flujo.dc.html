<script type="text/x-dc" data-dc-script data-props='{"flujo":{"editor":"boolean","default":true},"sinRed":{"editor":"boolean","default":false},"$preview":{"width":1024,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const flujo = this.props.flujo ?? true;
    const sinRed = this.props.sinRed === true;
    const s = [];
    for (let i = 0; i <= 120; i++) {
      let v;
      if (i < 28) v = 0;
      else if (i < 53) v = 6.6 + 1.6 * Math.sin((i - 28) / 4) + (i % 3) * 0.25;
      else if (i < 70) v = 0;
      else if (i < 74) v = 4 + (i - 70) * 2.1;
      else v = 12.1 + 0.45 * Math.sin(i / 3.1) + 0.2 * Math.sin(i / 1.7);
      s.push(Math.max(0, v));
    }
    s[120] = 12.4;
    if (!flujo) { for (let i = 114; i <= 120; i++) s[i] = 0; }
    const Y = (v) => 20 + 92 - v / 20 * 92;
    const puntos = s.map((v, i) => (72 + i / 120 * 896).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ');
    return {
      sinFlujo: !flujo,
      sinRed: sinRed,
      enlace: sinRed ? '' : 'DetalleF.dc.html',
      caudal: flujo ? '12.4' : ' 0.0',
      colorCaudal: flujo ? '#3cc8ea' : '#7c8793',
      puntos: puntos,
      yFinal: Y(s[120]).toFixed(1)
    };
  }
}
</script>
